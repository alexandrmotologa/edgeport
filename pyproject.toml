[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edgeport"
version = "0.1.0"
description = "Self-hosted reverse tunneling and webhook replay engine"
readme = "README.md"
authors = [
    { name = "Alexandr Motologa", email = "alexandrmotologa@users.noreply.github.com" }
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "textual>=0.70.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "starlette>=0.37.0",
    "uvicorn>=0.29.0",
    "cryptography>=42.0.0",
    "segno>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
edgeport = "edgeport.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/edgeport"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []
